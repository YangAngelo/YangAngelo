<svg xmlns="http://www.w3.org/2000/svg" width="990" height="300" viewBox="0 0 990 300">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d4ff"/><stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <style>
    .t { font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif; fill: #e6edf3; }
    .d { font: 700 12px 'Segoe UI', Ubuntu, Sans-Serif; fill: #00d4ff; letter-spacing: .5px; }
    .r { font: 700 15px 'Segoe UI', Ubuntu, Sans-Serif; fill: #e6edf3; }
    .c { font: 600 13px 'Segoe UI', Ubuntu, Sans-Serif; fill: #a855f7; }
    .s { font: 400 12px 'Segoe UI', Ubuntu, Sans-Serif; fill: #8b949e; }
    .line { stroke-dasharray: 960; stroke-dashoffset: 960; animation: draw 1.6s ease-out forwards; }
    .f { opacity: 0; animation: fade .6s ease-out forwards; }
    .pulse { animation: pulse 2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes pulse { 0%, 100% { opacity: .9; transform: scale(1); } 50% { opacity: .3; transform: scale(1.9); } }
  </style>
  <rect x=".5" y=".5" width="989" height="299" rx="12" fill="#161b22" stroke="#30363d"/>
  <text x="20" y="36" class="t">🧭 Trajetória profissional</text>

  <line x1="40" y1="84" x2="950" y2="84" stroke="url(#g)" stroke-width="3" stroke-linecap="round" class="line"/>

  <!-- IBIZ -->
  <g class="f" style="animation-delay:.3s">
    <circle cx="70" cy="84" r="8" fill="#161b22" stroke="#00d4ff" stroke-width="3"/>
    <text x="40" y="122" class="d">JAN 2024 – JAN 2025</text>
    <text x="40" y="146" class="r">Analista de Suporte e</text>
    <text x="40" y="165" class="r">Monitoramento</text>
    <text x="40" y="186" class="c">IBIZ Tecnologia</text>
    <text x="40" y="212" class="s">• Monitoramento de bancos produtivos</text>
    <text x="40" y="230" class="s">• Suporte especializado N1/N2</text>
    <text x="40" y="248" class="s">• Dashboards de BI no AWS QuickSight</text>
  </g>

  <!-- Tech Intelligence -->
  <g class="f" style="animation-delay:.7s">
    <circle cx="370" cy="84" r="8" fill="#161b22" stroke="#6b8cf7" stroke-width="3"/>
    <text x="340" y="122" class="d">DEZ 2024 – ATUAL</text>
    <text x="340" y="146" class="r">Analista de Infraestrutura</text>
    <text x="340" y="165" class="r">Cloud &amp; DevOps</text>
    <text x="340" y="186" class="c">Tech Intelligence</text>
    <text x="340" y="212" class="s">• Multi-cloud: Azure, GCP, AWS, Oracle Cloud</text>
    <text x="340" y="230" class="s">• Docker, Terraform e pipelines CI/CD</text>
    <text x="340" y="248" class="s">• MongoDB, Redis, Data Lake e infra para IA</text>
    <text x="340" y="266" class="s">• Zabbix e Datadog · tuning de ERP Protheus</text>
  </g>

  <!-- G+D via Tech Intelligence -->
  <g class="f" style="animation-delay:1.1s">
    <circle cx="670" cy="84" r="8" fill="#a855f7" class="pulse"/>
    <circle cx="670" cy="84" r="8" fill="#161b22" stroke="#a855f7" stroke-width="3"/>
    <text x="640" y="122" class="d">JAN 2025 – ATUAL</text>
    <text x="640" y="146" class="r">SQL Server &amp; Data Platform</text>
    <text x="640" y="165" class="r">Architect (DBA)</text>
    <text x="640" y="186" class="c">Giesecke+Devrient · via Tech Intelligence</text>
    <text x="640" y="212" class="s">• Bases, instâncias e integrações de clientes</text>
    <text x="640" y="230" class="s">  bancários: Itaú, Bradesco, Santander, PicPay…</text>
    <text x="640" y="248" class="s">• AlwaysOn AG, backup/DR com RPO/RTO</text>
    <text x="640" y="266" class="s">• Tuning, segurança, auditoria e LGPD</text>
  </g>
</svg>
